<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1730">
<meta name="description" content="Irrwald: kostenlose Browserspiele ohne Download. Aussuchen, anklicken, losspielen.">
<title>Irrwald – Kostenlose Spiele online spielen</title>
<style>
:root{
  --bg:#0f1730; --bg2:#172352; --card:#1f2f66; --text:#f3f6ff; --muted:#a3b3e0;
  --glow:#ffd23f; --ink:#2a1f00; --mint:#3de0b0; --pink:#ff5d8f;
  --head:ui-rounded,"Arial Rounded MT Bold","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;color:var(--text);font:600 16px/1.5 var(--body);
  background:radial-gradient(640px 420px at 88% -40px,rgba(255,93,143,.22),transparent) no-repeat,
             radial-gradient(760px 520px at -6% 26%,rgba(61,224,176,.15),transparent) no-repeat,var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:80}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--glow);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;display:flex;align-items:center;gap:18px;padding:12px 24px;background:rgba(15,23,48,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;font:800 27px/1 var(--head);letter-spacing:-.01em}
.brand span{background:linear-gradient(90deg,var(--glow),var(--mint));-webkit-background-clip:text;background-clip:text;color:transparent}
.search{position:relative;flex:1;max-width:620px}
.search svg{position:absolute;left:18px;top:50%;translate:0 -50%;color:var(--muted);pointer-events:none}
.search input{width:100%;height:46px;padding:0 48px 0 50px;border:0;border-radius:999px;background:var(--bg2);color:var(--text);font:700 16px var(--body);transition:box-shadow .15s,background .15s}
.search input::placeholder{color:var(--muted)}
.search input::-webkit-search-cancel-button{display:none}
.search input:focus{outline:none;background:var(--card);box-shadow:0 0 0 3px var(--mint)}
.clear{position:absolute;right:9px;top:50%;translate:0 -50%;width:30px;height:30px;border:0;border-radius:50%;background:var(--card);color:var(--muted);display:none}
.search.has .clear{display:block}
.kbd{position:absolute;right:16px;top:50%;translate:0 -50%;padding:0 9px;border-radius:7px;background:var(--card);color:var(--muted);font-size:13px}
.search.has .kbd,.search:focus-within .kbd{display:none}
.sug{position:absolute;inset:calc(100% + 8px) 0 auto;margin:0;padding:6px;list-style:none;background:var(--bg2);border-radius:22px;box-shadow:0 22px 50px rgba(0,0,0,.5);display:none}
.sug.open{display:block}
.sug li{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:16px;cursor:pointer}
.sug li[aria-selected="true"],.sug li:hover{background:var(--card)}
.sug .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:22px;flex:none;overflow:hidden}
.sug .ic img{width:100%;height:100%;object-fit:cover}
.sug b{display:block;font:700 16px var(--head)}
.sug small{color:var(--muted)}
.lucky{height:46px;padding:0 20px;border:0;border-radius:999px;background:var(--bg2);font-weight:800;white-space:nowrap;transition:background .15s,transform .15s}
.lucky:hover{background:var(--card);transform:translateY(-1px)}

.app{display:grid;grid-template-columns:96px 1fr;align-items:start}
.rail{position:sticky;top:calc(76px + env(safe-area-inset-top,0px));margin:6px 0 0 16px;padding:8px;background:var(--bg2);border-radius:26px;display:flex;flex-direction:column;gap:4px;max-height:calc(100vh - 100px);overflow-y:auto;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.cat{display:flex;flex-direction:column;align-items:center;gap:1px;padding:9px 2px;border:0;border-radius:18px;background:transparent;color:var(--muted);font-size:11.5px;font-weight:800;transition:background .15s,color .15s,transform .15s}
.cat span{font-size:23px;line-height:1.15}
.cat:hover{background:var(--card);color:var(--text)}
.cat[aria-pressed="true"]{background:linear-gradient(160deg,#ffe277,#ffb62e);color:var(--ink);box-shadow:0 8px 20px rgba(255,190,50,.3)}

main{min-width:0;width:100%;max-width:1480px;margin-inline:auto;padding:8px clamp(14px,2.6vw,30px) 56px}

.hero{position:relative;overflow:hidden;isolation:isolate;display:flex;align-items:center;height:clamp(260px,28vw,400px);border-radius:30px;background:linear-gradient(115deg,#2c3f94 0%,#18255a 55%,#121b45);box-shadow:0 18px 44px rgba(0,0,0,.35)}
.hbg{position:absolute;top:0;right:0;height:100%;aspect-ratio:16/9;z-index:-1;cursor:pointer;-webkit-mask-image:linear-gradient(90deg,transparent,#000 42%);mask-image:linear-gradient(90deg,transparent,#000 42%)}
.hbg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.htxt{padding:28px clamp(22px,4vw,52px);max-width:50%}
.eyebrow{display:inline-block;padding:4px 13px;border-radius:999px;background:rgba(255,255,255,.14);font:800 12px var(--head);letter-spacing:.08em;text-transform:uppercase}
.ht{margin:12px 0 8px;font:800 clamp(30px,5vw,58px)/1 var(--head);letter-spacing:-.02em}
.htxt p{margin:0 0 20px;color:#cdd8fb;max-width:36ch}
.cta{display:inline-flex;align-items:center;gap:8px;padding:14px 28px;border:0;border-radius:999px;background:linear-gradient(160deg,#ffe277,#ffb62e);color:var(--ink);font:800 18px var(--head);box-shadow:0 12px 28px rgba(255,190,50,.38);transition:transform .15s,box-shadow .15s}
.cta:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 16px 34px rgba(255,190,50,.5)}

h2.sec,#title{display:flex;align-items:center;gap:10px;font:800 23px var(--head);margin:32px 4px 14px}
#title small,h2.sec small{padding:2px 11px;border-radius:999px;background:var(--bg2);color:var(--muted);font:700 13px var(--body)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));grid-auto-flow:dense;gap:16px}
.tile{position:relative;aspect-ratio:1;border:0;padding:0;border-radius:24px;overflow:hidden;background:var(--card);isolation:isolate;box-shadow:0 8px 20px rgba(0,0,0,.3);transition:transform .2s cubic-bezier(.3,1.4,.5,1),box-shadow .2s}
.tile.big{grid-column:span 2;grid-row:span 2}
.tile .art{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(46px,7vw,72px);z-index:-1}
.tile .art img{width:100%;height:100%;object-fit:cover}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.2),transparent 40%);pointer-events:none}
.tile .name{position:absolute;inset:auto 0 0;padding:34px 14px 12px;text-align:left;font:800 18px/1.15 var(--head);background:linear-gradient(transparent,rgba(8,12,32,.92));color:#fff;transform:translateY(100%);transition:transform .2s}
.tile:hover,.tile:focus-visible{transform:scale(1.07) rotate(-.6deg);box-shadow:0 18px 40px rgba(255,210,63,.32);z-index:2}
.tile:hover .name,.tile:focus-visible .name{transform:none}
@media (hover:none){.tile .name{transform:none}}
.badge{position:absolute;top:10px;left:10px;z-index:3;padding:3px 11px;border-radius:999px;font:800 12px var(--head);background:var(--pink);color:#fff;box-shadow:0 4px 12px rgba(255,93,143,.45)}
.vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s;pointer-events:none}
.vid.on{opacity:1}
.tile .vid{object-fit:contain}
.tile .art img{transition:filter .35s,transform .35s}
.tile.vp .art img{filter:blur(14px) brightness(.55);transform:scale(1.3)}

.empty{margin:20px 0;padding:42px 20px 34px;text-align:center;border-radius:28px;background:var(--bg2)}
.empty svg{width:min(320px,70%);height:auto}
.empty svg g{fill:#26397f}.empty svg rect{fill:#2f4496}
.empty h3{font:800 26px var(--head);margin:10px 0 4px}
.empty p{margin:0 auto;max-width:44ch;color:var(--muted)}
.btn{padding:9px 20px;border:0;border-radius:999px;background:var(--card);font-weight:800;transition:background .15s}
.btn:hover{background:#2b4090}
.reset{margin-top:14px}
footer{margin-top:60px;color:var(--muted);font-size:14px}
footer a{color:var(--muted);margin-right:18px}footer a:hover{color:var(--text)}
.acts{margin-left:auto;display:flex;gap:10px}
a.lucky{display:inline-flex;align-items:center;color:var(--text);text-decoration:none}

.player{position:fixed;inset:0;z-index:90;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.player.open{display:flex}
.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--bg2)}
.bar h3{font:800 20px var(--head);margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage{flex:1;min-height:0;display:grid;place-items:center;background:#060a1c}
.stage iframe{width:100%;height:100%;border:0;background:#000}

@media (max-width:900px){
  .hd{gap:10px;padding:10px 14px}
  .brand{font-size:22px}.brand svg{width:26px;height:26px}
  .lucky,.kbd{display:none}
  .app{grid-template-columns:1fr}
  .rail{position:fixed;inset:auto 10px calc(10px + env(safe-area-inset-bottom,0px));z-index:70;margin:0;flex-direction:row;max-height:none;overflow-x:auto;overflow-y:hidden;padding:6px;gap:2px;border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .cat{flex:0 0 auto;min-width:66px;padding:6px 8px}
  .cat span{font-size:20px}
  main{padding-bottom:110px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:11px}
  .tile{border-radius:20px}
}
@media (max-width:700px){
  .hero{flex-direction:column;align-items:stretch;height:auto;min-height:0}
  .hbg{position:relative;top:auto;right:auto;width:100%;height:auto;aspect-ratio:16/9;z-index:0;-webkit-mask-image:linear-gradient(180deg,#000 60%,transparent);mask-image:linear-gradient(180deg,#000 60%,transparent)}
  .htxt{position:relative;max-width:none;padding:0 22px 24px;margin-top:-34px}
}
@media (max-width:380px){.brand span{display:none}.ht{font-size:30px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="hd">
  <a class="brand" href="#" aria-label="Irrwald Startseite"><svg width="32" height="32" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 3 8 20h6L6 31h11v6h6v-6h11l-8-11h6z" fill="#3de0b0"/><circle cx="31" cy="9" r="3.4" fill="#ffd23f"/></svg><span>Irrwald</span></a>
  <div class="search" id="sbox">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Spiele suchen …" aria-label="Spiele suchen" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="sug">
    <span class="kbd" aria-hidden="true">/</span>
    <button class="clear" id="clear" aria-label="Suche leeren">✕</button>
    <ul class="sug" id="sug" role="listbox"></ul>
  </div>
  <div class="acts"><a class="lucky" href="einreichen.html">+ Spiel einreichen</a><button class="lucky" id="lucky" hidden>🎲 Zufallsspiel</button></div>
</header>
<div class="app">
  <nav class="rail" aria-label="Kategorien" id="cats"></nav>
  <main>
    <h1 class="sr">Irrwald – kostenlose Browserspiele</h1>
    <section class="hero" id="hero"></section>
    <div id="recent"></div>
    <h2 id="title">Alle Spiele <small id="count"></small></h2>
    <div class="grid" id="grid"></div>
    <div id="msg"></div>
    <footer><a href="impressum.html">Impressum</a><a href="datenschutz.html">Datenschutz</a><a href="einreichen.html">Spiel einreichen</a><span>© 2026 Irrwald</span></footer>
  </main>
</div>
<div class="player" id="player" role="dialog" aria-modal="true" aria-labelledby="ptitle">
  <div class="bar"><button class="btn" id="back">‹ Zurück</button><h3 id="ptitle"></h3><button class="btn" id="full">Vollbild</button></div>
  <div class="stage" id="stage"></div>
</div>
<script>
/* ============ SPIELE ============
   Ein Spiel hinzufügen = einen Eintrag in diese Liste setzen:
   {id:'pilzjaeger', title:'Pilzjäger', cat:'Action', tags:['pilze','wald'], icon:'🍄',
    c:['#ec5f4b','#a82f3a'], thumb:'Bild-URL (optional)', badge:'Neu', big:true,
    src:'Link zum Spiel'  ODER  html:'kompletter Spiel-Code'} */
const GAMES = [
  {id:'blockbow', title:'Blockbow', cat:'Puzzle', tags:['bloecke','linien','denken','tetris'], icon:'🏹',
   c:['#3b4bb8','#141a52'], badge:'Neu', featured:true, desc:'Knobelspiel mit Blöcken in drei Schwierigkeitsstufen. Kostenlos im Browser.', src:'blockbow.html',
   thumb:'blockbow-square.webp', video:'blockbow-portrait.mp4',
   cover:'blockbow-landscape.webp', coverVideo:'blockbow-landscape.mp4'}
];

const CAT_ICONS = {Action:'💥',Puzzle:'🧩',Geschick:'🎯',Rennen:'🏁','Zwei Spieler':'👥',Denken:'🧠',Sport:'⚽',Abenteuer:'🗺️',Strategie:'♟️'};
const $=id=>document.getElementById(id);
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ß/g,'ss');
let cat='Alle', term='', active=-1, sugList=[];

const hay=g=>norm([g.title,g.cat,...(g.tags||[])].join(' '));
function search(t){
  const words=norm(t).split(/\s+/).filter(Boolean);
  if(!words.length) return GAMES.slice();
  return GAMES.filter(g=>{const h=hay(g);return words.every(w=>h.includes(w))})
    .sort((a,b)=>(norm(b.title).startsWith(words[0])?1:0)-(norm(a.title).startsWith(words[0])?1:0));
}
function art(g){return g.thumb?`<img src="${g.thumb}" alt="" loading="lazy">`:g.icon||'🎮'}
function bg(g){return g.thumb?'':`background:linear-gradient(145deg,${(g.c||['#6fd3c0','#2c7d78'])[0]},${(g.c||['#6fd3c0','#2c7d78'])[1]})`}

function renderCats(){
  const cats=['Alle',...new Set(GAMES.map(g=>g.cat))];
  if(GAMES.some(g=>g.badge==='Neu')) cats.splice(1,0,'Neu');
  if(GAMES.some(g=>g.badge==='Beliebt')) cats.splice(cats.includes('Neu')?2:1,0,'Beliebt');
  const icons={...CAT_ICONS,Alle:'🌲',Neu:'🌟',Beliebt:'🔥'};
  $('cats').innerHTML=cats.map(c=>`<button class="cat" data-c="${c}" aria-pressed="${c===cat}"><span aria-hidden="true">${icons[c]||'🎮'}</span>${c}</button>`).join('');
  $('lucky').hidden=GAMES.length<2;
}
function inCat(g){return cat==='Alle'||g.cat===cat||g.badge===cat}

function renderGrid(){
  const list=search(term).filter(inCat);
  $('title').firstChild.textContent=term?`Ergebnisse für „${term}“ `:(cat==='Alle'?'Alle Spiele ':cat+' ');
  $('count').textContent=GAMES.length?`${list.length} ${list.length===1?'Spiel':'Spiele'}`:'';
  $('grid').innerHTML=list.map(g=>`
    <button class="tile${g.big?' big':''}" data-id="${g.id}" aria-label="${g.title} spielen">
      <span class="art" style="${bg(g)}" aria-hidden="true">${art(g)}</span>
      ${g.badge?`<span class="badge">${g.badge}</span>`:''}
      <span class="name">${g.title}</span>
    </button>`).join('');
  const m=$('msg');
  if(!GAMES.length){
    m.innerHTML=`<div class="empty">
      <svg viewBox="0 0 320 130" aria-hidden="true"><g fill="#1c4a3c"><path d="M30 120 52 62 74 120z"/><path d="M60 120 90 40 120 120z"/><path d="M110 120 135 55 160 120z"/><path d="M150 120 182 30 214 120z"/><path d="M205 120 228 62 251 120z"/><path d="M240 120 268 48 296 120z"/></g><rect x="0" y="118" width="320" height="4" rx="2" fill="#25493e"/><circle cx="108" cy="40" r="3.5" fill="#f4d35e"/><circle cx="214" cy="66" r="3" fill="#f4d35e"/><circle cx="262" cy="30" r="2.5" fill="#f4d35e"/><circle cx="60" cy="72" r="2.5" fill="#f4d35e"/></svg>
      <h3>Die ersten Spiele ziehen ein</h3><p>Schau bald wieder vorbei. Hier erscheinen alle Spiele, sortiert nach Kategorien.</p></div>`;
  } else if(!list.length){
    m.innerHTML=`<div class="empty"><h3>Nichts gefunden</h3><p>${term?`Zu „${term}“ gibt es kein Spiel.`:'In dieser Kategorie gibt es noch kein Spiel.'} Probier einen anderen Begriff oder eine andere Kategorie.</p><button class="btn reset" id="reset">Alle Spiele zeigen</button></div>`;
  } else m.innerHTML='';
}
function renderRecent(){
  let ids=[]; try{ids=JSON.parse(localStorage.getItem('irrwald:recent')||'[]')}catch(_){}
  const list=ids.map(i=>GAMES.find(g=>g.id===i)).filter(Boolean);
  $('recent').innerHTML=(list.length&&!term&&cat==='Alle')?`<h2>Zuletzt gespielt</h2><div class="grid">${list.map(g=>`
    <button class="tile" data-id="${g.id}" aria-label="${g.title} spielen"><span class="art" style="${bg(g)}" aria-hidden="true">${art(g)}</span><span class="name">${g.title}</span></button>`).join('')}</div>`:'';
}
const REDUCE=matchMedia('(prefers-reduced-motion:reduce)').matches||!!(navigator.connection&&navigator.connection.saveData);
function vid(src){const v=document.createElement('video');v.className='vid';v.src=src;v.muted=true;v.loop=true;v.playsInline=true;v.preload='none';v.setAttribute('aria-hidden','true');return v}
function renderHero(){
  const g=GAMES.find(x=>x.featured)||GAMES[0], h=$('hero');
  if(!g){h.innerHTML='<div class="htxt"><span class="eyebrow">Willkommen</span><h2 class="ht">Verirr dich in neuen Spielen</h2><p>Kostenlose Browserspiele ohne Download.</p></div>';return}
  h.innerHTML=`<div class="hbg hmedia" data-id="${g.id}">${g.cover?`<img src="${g.cover}" alt="">`:''}</div>
    <div class="htxt"><span class="eyebrow">${g.badge||'Empfohlen'} · ${g.cat}</span><h2 class="ht">${g.title}</h2>
    <p>${g.desc||'Kostenlos im Browser spielen.'}</p><button class="cta" data-id="${g.id}">▶ Jetzt spielen</button></div>`;
  if(g.coverVideo&&!REDUCE){const v=vid(g.coverVideo);v.preload='metadata';h.querySelector('.hbg').appendChild(v);v.play().then(()=>v.classList.add('on')).catch(()=>{})}
}
let hov=null,hovT=null;
function tileOn(t){const g=GAMES.find(x=>x.id===t.dataset.id);if(!g||!g.video||REDUCE)return;
  hovT=setTimeout(()=>{let v=t.querySelector('.vid');if(!v){v=vid(g.video);t.insertBefore(v,t.querySelector('.name'))}v.play().then(()=>{v.classList.add('on');t.classList.add('vp')}).catch(()=>{})},350)}
function tileOff(t){clearTimeout(hovT);const v=t.querySelector('.vid');if(v){v.classList.remove('on');t.classList.remove('vp');setTimeout(()=>{if(!v.classList.contains('on'))v.pause()},350)}}
function hoverTo(t){if(t===hov)return;if(hov)tileOff(hov);hov=t;if(t)tileOn(t)}
document.addEventListener('mouseover',e=>hoverTo(e.target.closest('.tile')));
document.addEventListener('focusin',e=>hoverTo(e.target.closest('.tile')));
document.addEventListener('focusout',()=>hoverTo(null));
function renderAll(){renderCats();renderGrid();renderRecent();renderHero()}

/* Suche */
function renderSug(){
  const ul=$('sug'), inp=$('q');
  sugList=term?search(term).slice(0,6):[];
  active=-1;
  ul.innerHTML=sugList.map((g,i)=>`<li role="option" id="s${i}" data-id="${g.id}" aria-selected="false"><span class="ic" style="${bg(g)}">${art(g)}</span><span><b>${g.title}</b><small>${g.cat}</small></span></li>`).join('');
  const open=sugList.length>0;
  ul.classList.toggle('open',open); inp.setAttribute('aria-expanded',open);
}
function setActive(n){
  active=n;
  sugList.forEach((_,i)=>$('s'+i).setAttribute('aria-selected',i===n));
  $('q').setAttribute('aria-activedescendant',n>=0?'s'+n:'');
}
function closeSug(){$('sug').classList.remove('open');$('q').setAttribute('aria-expanded','false')}
$('q').addEventListener('input',e=>{
  term=e.target.value.trim();
  $('sbox').classList.toggle('has',!!e.target.value);
  renderSug(); renderGrid(); renderRecent();
});
$('q').addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'&&sugList.length){e.preventDefault();setActive((active+1)%sugList.length)}
  else if(e.key==='ArrowUp'&&sugList.length){e.preventDefault();setActive((active-1+sugList.length)%sugList.length)}
  else if(e.key==='Enter'){ if(active>=0) openGame(sugList[active]); else if(sugList.length===1) openGame(sugList[0]); else closeSug(); }
  else if(e.key==='Escape'){closeSug()}
});
$('sug').addEventListener('mousedown',e=>{const li=e.target.closest('li');if(li){e.preventDefault();openGame(GAMES.find(g=>g.id===li.dataset.id))}});
$('q').addEventListener('blur',()=>setTimeout(closeSug,120));
$('q').addEventListener('focus',()=>{if(term)renderSug()});
$('clear').addEventListener('click',()=>{const q=$('q');q.value='';term='';$('sbox').classList.remove('has');closeSug();renderGrid();renderRecent();q.focus()});
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)&&!$('player').classList.contains('open')){e.preventDefault();$('q').focus()}
  if(e.key==='Escape'&&$('player').classList.contains('open')) closeGame();
});

$('cats').addEventListener('click',e=>{const b=e.target.closest('.cat');if(!b)return;cat=b.dataset.c;renderAll()});
$('msg').addEventListener('click',e=>{if(e.target.id==='reset'){cat='Alle';term='';$('q').value='';$('sbox').classList.remove('has');renderAll()}});
document.querySelector('main').addEventListener('click',e=>{const t=e.target.closest('.tile,.cta,.hmedia');if(t)openGame(GAMES.find(g=>g.id===t.dataset.id))});
$('lucky').addEventListener('click',()=>openGame(GAMES[Math.floor(Math.random()*GAMES.length)]));

/* Player */
let lastFocus=null;
function openGame(g){
  if(!g) return;
  lastFocus=document.activeElement; closeSug();
  $('ptitle').textContent=g.title;
  const st=$('stage'); st.innerHTML='';
  const f=document.createElement('iframe');
  f.title=g.title; f.allow='fullscreen; gamepad; autoplay';
  f.setAttribute('sandbox','allow-scripts allow-same-origin allow-pointer-lock allow-popups');
  if(g.src) f.src=g.src; else f.srcdoc=g.html||'';
  st.appendChild(f);
  $('player').classList.add('open'); document.body.style.overflow='hidden'; $('back').focus();
  try{const r=JSON.parse(localStorage.getItem('irrwald:recent')||'[]').filter(i=>i!==g.id);r.unshift(g.id);localStorage.setItem('irrwald:recent',JSON.stringify(r.slice(0,6)))}catch(_){}
}
function closeGame(){
  $('player').classList.remove('open'); $('stage').innerHTML=''; document.body.style.overflow='';
  renderRecent(); if(lastFocus) lastFocus.focus();
}
$('back').addEventListener('click',closeGame);
$('full').addEventListener('click',()=>{const el=$('stage');try{(el.requestFullscreen||el.webkitRequestFullscreen).call(el)}catch(_){}});

renderAll();
</script>
</body>
</html>
